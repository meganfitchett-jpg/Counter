<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    font-family: Arial, sans-serif;
  }
  .counter {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .count {
    min-width: 70px;
    text-align: center;
    font-size: 48px;
    font-weight: bold;
  }
  button {
    width: 50px;
    height: 50px;
    font-size: 28px;
    border: none;
    border-radius: 50%;
    background: #4a6cf7;
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: #3453d1; }
</style>
</head>
<body>
  <div class="counter">
    <button id="minus">−</button>
    <div class="count" id="count">0</div>
    <button id="plus">+</button>
  </div>
  <script>
    let n = 0;
    const el = document.getElementById('count');
    document.getElementById('plus').onclick = () => { n++; el.textContent = n; };
    document.getElementById('minus').onclick = () => { n--; el.textContent = n; };
  </script>
</body>
</html>
